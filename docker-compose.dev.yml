version: '3.9'

# Development override — starts only postgres, runs API locally via pnpm dev
services:
  postgres:
    ports:
      - '5432:5432'

  api:
    build:
      target: builder
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
    environment:
      NODE_ENV: development
    command: pnpm --filter @zurich/api dev
